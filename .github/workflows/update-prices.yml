name: Update ETF Prices

on:
  schedule:
    # 평일 오후 4시 (KST) = UTC 07:00
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch ETF prices from Naver Finance
        run: |
          python3 - << 'PYEOF'
          import json, urllib.request, datetime

          ETF_CODES = {
            "나스닥":   "133690",
            "SP500":    "360750",
            "반도체":   "381180",
            "레버리지": "406970"
          }

          prices = {}
          for key, code in ETF_CODES.items():
              urls = [
                f"https://polling.finance.naver.com/api/realtime/domestic/stock/{code}",
                f"https://m.stock.naver.com/api/stock/{code}/integration",
              ]
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={
                          "User-Agent": "Mozilla/5.0 (compatible; price-bot)",
                          "Referer": "https://finance.naver.com"
                      })
                      with urllib.request.urlopen(req, timeout=10) as r:
                          data = json.loads(r.read())
                          # polling API
                          price = data.get("result", {}).get("itemList", [{}])[0].get("sv")
                          # mobile API fallback
                          if not price:
                              raw = data.get("closePrice", "0")
                              price = int(str(raw).replace(",", "")) if raw else None
                          if price and int(price) > 0:
                              prices[key] = int(price)
                              print(f"✓ {key} ({code}): {price:,}원")
                              break
                  except Exception as e:
                      print(f"  {url} 실패: {e}")

          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
          result = {
              "prices": prices,
              "updated": now.strftime("%Y-%m-%d %H:%M KST"),
              "date": now.strftime("%Y-%m-%d")
          }

          with open("prices.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"\n저장 완료: {result}")
          PYEOF

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add prices.json
          git diff --staged --quiet || git commit -m "chore: update ETF prices $(date +'%Y-%m-%d')"
          git push
